name: Release

# Dispara quando você empurra uma tag começando com "v" (ex.: v1.0.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessário para criar o Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # package.sh cross-compila os 4 alvos, baixa o ffmpeg estático de cada
      # plataforma e monta dist/*.tar.gz (Linux) e dist/*.zip (Windows, com os .bat).
      # O runner ubuntu-latest já tem curl, tar, xz, unzip e python3.
      - name: Build dos pacotes (binário + ffmpeg, 4 plataformas)
        run: bash ./package.sh

      - name: Publicar o Release com os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
